# Builds both versions of FishBowl on every push and pull request, so a change to the shared files
# (FishBowl.Core.cs, FishBowl.Platform.cs) that breaks either Windows or Linux shows up as a failed check.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  remote-play:
    name: Remote-play service and browser controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install pinned server dependencies
        run: pnpm install --dir remote-play --frozen-lockfile --ignore-scripts
      - name: Verify token service and controls
        run: pnpm --dir remote-play test
      - name: Check browser source syntax
        run: node --check remote-play/client/client.js

  windows:
    name: Windows (csc.exe, C# 5)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build released Windows source with the .NET Framework compiler
        shell: pwsh
        run: ./windows/Build.ps1
      - name: Run Windows regression tests
        shell: pwsh
        run: '& "./windows/Run Tests.ps1"'
      - name: Compile retained shared source with C# 5
        shell: pwsh
        run: |
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:library /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /out:SharedCompatibility.dll FishBowl.Model.cs FishBowl.Core.cs FishBowl.Platform.cs FishBowl.Library.cs FishBowl.Games.cs FishBowl.GameTools.cs FishBowl.Integrations.cs FishBowl.SaveTools.cs FishBowl.Sessions.cs FishBowl.LivingRoom.cs

          if ($LASTEXITCODE -ne 0) { throw 'Shared C# 5 compilation failed' }
      - name: Package complete Windows app and source
        shell: pwsh
        run: ./windows/Package.ps1 -OutputDirectory artifacts/windows -ExpectedVersion 1.28.1
      - uses: actions/upload-artifact@v7
        with:
          name: FishBowl-windows
          path: artifacts/windows/

  linux:
    name: Linux (Avalonia + core tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the Linux app
        run: dotnet build FishBowl.Avalonia/FishBowl.Avalonia.csproj -c Release
      - name: Run core tests
        run: dotnet run --project tests/FishBowl.Tests -c Release
      - name: Check newer Windows library fields survive Linux saves
        run: dotnet run --project tests/FishBowl.SchemaTests -c Release
      - name: Publish self-contained Linux x64 app
        run: dotnet publish FishBowl.Avalonia/FishBowl.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/linux-x64
      - name: Preserve Linux executable permissions
        run: tar -czf artifacts/FishBowl-linux-x64.tar.gz -C artifacts/linux-x64 .
      - uses: actions/upload-artifact@v7
        with:
          name: FishBowl-linux-x64
          path: artifacts/FishBowl-linux-x64.tar.gz
