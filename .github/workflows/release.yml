name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed source version, for example 1.29.2'
        required: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        shell: pwsh
        run: |
          ./windows/Build.ps1
          & './windows/Run Tests.ps1'
          & './windows/Run Overflow Audit.ps1'
          & './windows/Run Overflow Audit.ps1' -Compact
          foreach ($report in @('windows/overflow-audit/overflow-report.md','windows/overflow-audit-compact/overflow-report.md')) {
            if ((Get-Content $report -Raw) -notmatch '\*\*0 findings\*\*') { throw "Text overflow found in $report" }
          }
      - name: Package matching app, installer and source
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $env:REQUESTED_VERSION }
          ./windows/Package.ps1 -OutputDirectory artifacts/windows -ExpectedVersion $version
      - uses: actions/upload-artifact@v7
        with:
          name: FishBowl-release-windows
          path: artifacts/windows/
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build FishBowl.Avalonia -c Release
      - run: dotnet run --project tests/FishBowl.Tests -c Release
      - run: dotnet run --project tests/FishBowl.SchemaTests -c Release
      - run: dotnet publish FishBowl.Avalonia -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/linux-x64
      - name: Archive Linux executable with permissions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then version="$REQUESTED_VERSION"; fi
          grep -q "<Version>$version</Version>" FishBowl.Avalonia/FishBowl.Avalonia.csproj
          tar -czf "artifacts/FishBowl-$version-linux-x64.tar.gz" -C artifacts/linux-x64 .
      - name: Build AppImage
        run: linux/build-appimage.sh artifacts
      - name: Linux checksums
        run: cd artifacts && sha256sum *.tar.gz *.AppImage > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: FishBowl-release-linux-x64
          path: |
            artifacts/*.tar.gz
            artifacts/*.AppImage
            artifacts/SHA256SUMS-linux.txt
  publish:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require reviewed source on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v8
        with:
          path: packages
      - name: Publish complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          folder="packages/FishBowl-release-windows"
          (cd "$folder" && sha256sum --check SHA256SUMS.txt)
          linux="packages/FishBowl-release-linux-x64"
          (cd "$linux" && sha256sum --check SHA256SUMS-linux.txt)
          cat >> "$folder/RELEASE-NOTES.md" <<EOF

          ## Linux

          Download **FishBowl-$version-x86_64.AppImage**, make it executable (\`chmod +x\`, or Properties → Allow executing as program) and run it. **FishBowl-$version-linux-x64.tar.gz** holds the same program as a plain folder. SHA256SUMS-linux.txt covers both.
          EOF
          gh release create "$GITHUB_REF_NAME" "$folder/FishBowl-$version.zip" "$folder/FishBowl-$version-Source.zip" "$linux/FishBowl-$version-linux-x64.tar.gz" "$linux/FishBowl-$version-x86_64.AppImage" "$linux/SHA256SUMS-linux.txt" "$folder/SHA256SUMS.txt" "$folder/BUILD-INFO.json" "$folder/RELEASE-NOTES.md" --draft --title "FishBowl $GITHUB_REF_NAME" --notes-file "$folder/RELEASE-NOTES.md"
