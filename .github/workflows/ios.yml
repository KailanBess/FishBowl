name: iOS simulator build

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build unsigned simulator app
        run: xcodebuild -project ios/FishBowl.xcodeproj -scheme FishBowl -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
